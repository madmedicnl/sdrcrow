[package]
name = "sdrcrow-pttin"
version.workspace = true
edition.workspace = true

# The desk microphone and the pedal that key the transmitter (issue #636): the
# serial, HID and MIDI readers and the hub that debounces them. Shared by the
# station (`sdrcrow-radio`) and by the operator's own computer
# (`sdrcrow-ui`, native), so it carries none of the radio's dependencies.
# Native-only, like `sdrcrow-relay` and `sdrcrow-midi`.
[dependencies]
sdrcrow-types.workspace = true
sdrcrow-relay.workspace = true
sdrcrow-midi.workspace = true
serialport = { version = "4.10", default-features = false }
tracing.workspace = true
