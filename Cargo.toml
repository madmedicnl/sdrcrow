[workspace]
resolver = "3"
members = ["crates/*", "tools/antenna"]
default-members = [".", "crates/sdrcrow-types", "crates/sdrcrow-proto", "crates/sdrcrow-dsp", "crates/sdrcrow-radio", "crates/sdrcrow-config"]
# The vendored crates are reached through `[patch.crates-io]`, not as members:
# they are upstream's code under upstream's licences, not ours to lint or
# version with the rest.
exclude = ["vendor/soapysdr", "vendor/ewebsock", "vendor/xng", "vendor/mfsk-core"]

[patch.crates-io]

# `mfsk-core` 0.11.0 plus a fix for an out-of-bounds panic in the subtract
# path. `subtract_tones_lpf` sized its FFT from the slot buffer, where
# `subtractft8.f90` fixes `NFFT = NMAX` at least `NFRAME` — so a buffer
# shorter than the frame indexed past the end and panicked. With end
# correction on (the FT8 subtract's own setting) that was any `dt`, not
# just a mis-aligned candidate, and on the `.sic_early()` path it killed
# the FT8 decode worker: the station then decoded nothing for the rest of
# the session. The submodule is `madmedicnl/mfsk-core` at
# `fix/subtract-short-buffer-0.11`, one commit on top of 0.11.0 and
# nothing else; the same fix is upstream as jl1nie/mfsk-core#574 on a
# later base. Drop this and return to the plain 0.11 dependency once that
# lands.
mfsk-core = { path = "vendor/mfsk-core/mfsk-core" }

# `ewebsock` 0.8.0 with one error classifier widened. On Windows a blocking
# read whose timeout expires may be answered with `ERROR_IO_PENDING` (997)
# rather than with a timeout, and upstream treats anything that is not
# `WouldBlock`/`TimedOut` as a dead connection — so a remote client lost its
# session every twenty minutes or so and had to be reconnected by hand.
# See vendor/ewebsock/PROVENANCE.md; this stays until upstream carries it.
ewebsock = { path = "vendor/ewebsock" }

# `soapysdr` 0.5.1 with one method added: `Device::setting_info`, the call that
# says which settings a driver has. Upstream wraps `readSetting`/`writeSetting`
# but not the enumeration, and the raw device pointer it needs is private to the
# crate — so a host can set a driver setting it already knows the name of, but
# cannot discover one. That is what the SoapySDR settings panel is built on.
# See vendor/soapysdr/PROVENANCE.md; this stays until the method is upstream.
soapysdr = { path = "vendor/soapysdr" }

[workspace.package]
version = "1.0.0"
edition = "2024"
# The native binary links mfsk-core (GPL-3.0-or-later) for FT8/FT4 and the
# DeepCW model (AGPL-3.0-only) for CW, so the built binary carries both. AGPL is
# the stronger of the two and it adds §13: whoever is offered the program over a
# network has to be offered its source. Anyone running sdrcrow-server for remote
# clients is doing exactly that.
#
# Both are confined to one crate each — sdrcrow-digi and sdrcrow-deepcw — and
# the wasm remote client links neither.
license = "GPL-3.0-or-later"

# DSP is unusably slow unoptimized; keep deps and the sample-rate-hot crates
# fast in dev builds while the rest stays quick to compile.
[profile.dev.package."*"]
opt-level = 2

# The antenna MoM solver is an integrate-and-solve; unoptimized a few-second
# optimization becomes a minute under `cargo test`, so keep it fast there too.
[profile.test.package.antenna-model]
opt-level = 2

[profile.dev.package.sdrcrow-dsp]
opt-level = 2

[profile.dev.package.sdrcrow-radio]
opt-level = 2

# The CW skimmer's STFT + per-bin scan run every audio block; unoptimized they
# stutter the audio, so keep them fast in dev too.
[profile.dev.package.sdrcrow-skimmer]
opt-level = 2

# The ISM burst gate measures the power of every sample on every channel in the
# plan; unoptimized that alone outweighs the rest of the receive chain.
[profile.dev.package.sdrcrow-ism]
opt-level = 2

# The ADS-B preamble correlator touches every sample of a 2.4 Msps stream and
# then slices 112 bits per candidate; unoptimized it costs more than everything
# else in the receive chain put together.
[profile.dev.package.sdrcrow-adsb]
opt-level = 2

# Seven VDL2 channels each get a downconverter and a burst gate over the same
# window, and every one of them measures the power of every sample; unoptimized
# that alone outweighs the rest of the receive chain, exactly as the ISM gate
# does.
[profile.dev.package.sdrcrow-vdl2]
opt-level = 2

# One correlator and a 301-tap filter per audio sample; unoptimized the tests
# that render seconds of beacon take a quarter of a minute.
[profile.dev.package.sdrcrow-vor]
opt-level = 2

# Both AIS channels get a down-converter, a burst gate and a receive filter over
# the same window, and the filter is a dot product per sample; unoptimized that
# alone outweighs the rest of the receive chain, exactly as the VDL2 lane does.
[profile.dev.package.sdrcrow-ais]
opt-level = 2

# RADE's per-frame buffer shuffling sits between two C libraries that are
# always built optimized; leaving the Rust glue slow would stall the worker.
[profile.dev.package.sdrcrow-rade]
opt-level = 2

# The DRM worker shuffles buffers between two always-optimized C libraries on
# every block, for the same reason RADE's does.
[profile.dev.package.sdrcrow-drm]
opt-level = 2

# DeepCW's STFT runs ahead of every inference; unoptimized it costs more than
# the network it feeds.
[profile.dev.package.sdrcrow-deepcw]
opt-level = 2

[workspace.dependencies]
sdrcrow-olivia = { path = "crates/sdrcrow-olivia" }
sdrcrow-types = { path = "crates/sdrcrow-types" }
# The build stamp. No dependencies and no build inputs beyond one
# environment variable, so it builds for wasm32 alongside everything else.
sdrcrow-version = { path = "crates/sdrcrow-version" }
sdrcrow-proto = { path = "crates/sdrcrow-proto" }
sdrcrow-dsp = { path = "crates/sdrcrow-dsp" }
sdrcrow-atchat = { path = "crates/sdrcrow-atchat" }
sdrcrow-rade = { path = "crates/sdrcrow-rade" }
sdrcrow-drm = { path = "crates/sdrcrow-drm" }
sdrcrow-faad2 = { path = "crates/sdrcrow-faad2" }
sdrcrow-nrsc5 = { path = "crates/sdrcrow-nrsc5" }
sdrcrow-audio = { path = "crates/sdrcrow-audio" }
sdrcrow-server = { path = "crates/sdrcrow-server" }
sdrcrow-config = { path = "crates/sdrcrow-config" }
sdrcrow-ui = { path = "crates/sdrcrow-ui" }
sdrcrow-cat = { path = "crates/sdrcrow-cat" }
sdrcrow-midi = { path = "crates/sdrcrow-midi" }
sdrcrow-rigctld = { path = "crates/sdrcrow-rigctld" }
sdrcrow-rotator = { path = "crates/sdrcrow-rotator" }
sdrcrow-picup = { path = "crates/sdrcrow-picup" }
sdrcrow-hpsdr = { path = "crates/sdrcrow-hpsdr" }
sdrcrow-tci = { path = "crates/sdrcrow-tci" }
sdrcrow-icomnet = { path = "crates/sdrcrow-icomnet" }
sdrcrow-smartsdr = { path = "crates/sdrcrow-smartsdr" }
sdrcrow-r82xx = { path = "crates/sdrcrow-r82xx" }
sdrcrow-rtlsdr = { path = "crates/sdrcrow-rtlsdr" }
sdrcrow-rx888 = { path = "crates/sdrcrow-rx888" }
sdrcrow-airspyhf = { path = "crates/sdrcrow-airspyhf" }
sdrcrow-s4285 = { path = "crates/sdrcrow-s4285" }
sdrcrow-airspy = { path = "crates/sdrcrow-airspy" }
sdrcrow-hydrasdr = { path = "crates/sdrcrow-hydrasdr" }
sdrcrow-hackrf = { path = "crates/sdrcrow-hackrf" }
sdrcrow-pluto = { path = "crates/sdrcrow-pluto" }
sdrcrow-sdrplay = { path = "crates/sdrcrow-sdrplay" }
sdrcrow-elad = { path = "crates/sdrcrow-elad" }
sdrcrow-lime = { path = "crates/sdrcrow-lime" }
sdrcrow-limerfe = { path = "crates/sdrcrow-limerfe" }
sdrcrow-fobos = { path = "crates/sdrcrow-fobos" }
sdrcrow-relay = { path = "crates/sdrcrow-relay" }
sdrcrow-spyserver = { path = "crates/sdrcrow-spyserver" }
sdrcrow-kiwisdr = { path = "crates/sdrcrow-kiwisdr" }
sdrcrow-net = { path = "crates/sdrcrow-net" }
sdrcrow-winlink = { path = "crates/sdrcrow-winlink" }
sdrcrow-ax25 = { path = "crates/sdrcrow-ax25" }
sdrcrow-kiss = { path = "crates/sdrcrow-kiss" }
sdrcrow-deepcw = { path = "crates/sdrcrow-deepcw" }
sdrcrow-ism = { path = "crates/sdrcrow-ism" }
sdrcrow-aprs = { path = "crates/sdrcrow-aprs" }
sdrcrow-adsb = { path = "crates/sdrcrow-adsb" }
sdrcrow-vdl2 = { path = "crates/sdrcrow-vdl2" }
sdrcrow-ais = { path = "crates/sdrcrow-ais" }
sdrcrow-vor = { path = "crates/sdrcrow-vor" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
rustfft = "6"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
postcard = { version = "1", features = ["use-std"] }
crossbeam-channel = "0.5"
rtrb = "0.4"
# HFDL (ARINC 635) decode core, vendored under `vendor/xng` — a submodule pinned
# to one commit, so the build takes no network dependency of its own. The crates
# are not on crates.io and are reached by path (Route A, green-lit on
# dividebysandwich/sdrcrow#497). The dependency tree is modest (rustfft,
# num-complex, chrono, serde, crc — no protobuf); `airframesio/xng` is
# MIT/Apache-2.0 and its `PROVENANCE.md` records a clean-room derivation from
# ICAO Annex 10 / ARINC 635.
# Note for `cargo fmt`: unlike the other vendored trees, which are reached
# through `[patch.crates-io]`, this one is a plain path dependency — so
# `cargo fmt --all` follows it into xng's *own* workspace and rewrites every
# crate in it, about 800 files of upstream's code that are not ours to format.
# Nothing is committed by that (the submodule just goes dirty), but it is
# alarming and easy to mistake for a real diff. rustfmt's `ignore` key would
# fix it and is nightly-only, so on stable format our own crates by name
# instead: `cargo fmt -p sdrcrow-radio -p sdrcrow-ui …`, or check with
# `cargo fmt --all --check` and read past the `vendor/xng` lines.
xng-mode-hfdl = { path = "vendor/xng/crates/xng-mode-hfdl" }
# Radiosonde (Vaisala RS41) decode core, same vendored tree and same rules.
xng-mode-sonde = { path = "vendor/xng/crates/xng-mode-sonde" }
# Pure-Rust USB — the RTL-SDR backend's only dependency. No libusb, so it needs
# no system library on any target and ships in every build variant.
nusb = "0.2.7"
# Runtime dlopen, for the SDRplay backend's closed vendor library. Nothing is
# linked at build time, so this too ships in every build variant and simply
# reports "not installed" where the vendor API is absent.
libloading = "0.9"

[package]
name = "sdrcrow"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PowerSDR/Thetis-style SDR transceiver with a native GUI, a browser-served web UI, and FT8/FT4 digital modes"

[dependencies]
sdrcrow-types.workspace = true
sdrcrow-version.workspace = true
sdrcrow-proto.workspace = true
sdrcrow-dsp.workspace = true
sdrcrow-radio = { path = "crates/sdrcrow-radio", default-features = false }
sdrcrow-config.workspace = true
sdrcrow-net.workspace = true
sdrcrow-audio.workspace = true
sdrcrow-server.workspace = true
sdrcrow-cat.workspace = true
sdrcrow-hpsdr.workspace = true
sdrcrow-tci.workspace = true
sdrcrow-smartsdr.workspace = true
sdrcrow-icomnet.workspace = true
sdrcrow-rtlsdr.workspace = true
sdrcrow-rx888.workspace = true
sdrcrow-airspyhf.workspace = true
sdrcrow-airspy.workspace = true
sdrcrow-hydrasdr.workspace = true
sdrcrow-fobos.workspace = true
sdrcrow-hackrf.workspace = true
sdrcrow-pluto.workspace = true
sdrcrow-sdrplay.workspace = true
sdrcrow-elad.workspace = true
sdrcrow-lime.workspace = true
sdrcrow-limerfe.workspace = true
sdrcrow-relay.workspace = true
sdrcrow-spyserver.workspace = true
sdrcrow-kiwisdr.workspace = true
sdrcrow-ui = { workspace = true, features = ["remote"] }
# `accesskit` is one of eframe's defaults, and turning the defaults off
# silently switched it back off: without it the whole widget tree is
# invisible to NVDA, Orca and VoiceOver. It is native-only (it maps to
# egui-winit), so it costs the browser build nothing.
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "persistence",
] }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
num-complex.workspace = true
rtrb.workspace = true

[features]
default = ["soapy", "rtl433"]
# SoapySDR device support. Turn off (`--no-default-features`) for a CAT-only
# binary that builds and runs without libSoapySDR installed.
soapy = ["sdrcrow-radio/soapy"]
# The several hundred ISM device decoders of the embedded rtl_433. Needs a C
# compiler, CMake, and `git submodule update --init --recursive`. Turn off for a
# build with only sdrcrow's own ISM decoders.
rtl433 = ["sdrcrow-radio/rtl433"]
# Bundle the trunk-built web client into the binary (run `trunk build
# --release` in crates/sdrcrow-web first).
embed-web = ["sdrcrow-server/embed-web"]

# `cargo deb` packaging (used by the release workflow with --no-build after a
# `--features embed-web` release build).
# Base .deb = the standard (non-SoapySDR) build: drives CAT/OpenHPSDR/TCI and
# needs no libSoapySDR, so no SoapySDR recommendation. Package name `sdrcrow`.
[package.metadata.deb]
maintainer = "Josef Jahn <josef.jahn@gmail.com>"
copyright = "2026, Josef Jahn"
extended-description = """\
PowerSDR/Thetis-style software-defined-radio transceiver client with an egui \
GUI. Runs as a native desktop application or as a server that streams the same \
UI to a web browser. Drives CAT-controlled radios, OpenHPSDR, and TCI; includes \
FT8/FT4 digital modes and an integrated logbook. For SoapySDR device support \
(HackRF, RTL-SDR, etc.) install the sdrcrow-soapysdr package instead."""
section = "hamradio"
priority = "optional"
license-file = ["LICENSE", "0"]
features = ["embed-web"]
assets = [
    ["target/release/sdrcrow", "usr/bin/", "755"],
    ["packaging/linux/sdrcrow.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/60-sdrcrow-rtlsdr.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdrcrow-rx888.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdrcrow-airspyhf.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdrcrow-hackrf.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdrcrow-airspy.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdrcrow-hydrasdr.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdrcrow-elad.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdrcrow-limerfe.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdrcrow-relay.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/icons/sdrcrow-16.png", "usr/share/icons/hicolor/16x16/apps/sdrcrow.png", "644"],
    ["packaging/icons/sdrcrow-24.png", "usr/share/icons/hicolor/24x24/apps/sdrcrow.png", "644"],
    ["packaging/icons/sdrcrow-32.png", "usr/share/icons/hicolor/32x32/apps/sdrcrow.png", "644"],
    ["packaging/icons/sdrcrow-48.png", "usr/share/icons/hicolor/48x48/apps/sdrcrow.png", "644"],
    ["packaging/icons/sdrcrow-64.png", "usr/share/icons/hicolor/64x64/apps/sdrcrow.png", "644"],
    ["packaging/icons/sdrcrow-128.png", "usr/share/icons/hicolor/128x128/apps/sdrcrow.png", "644"],
    ["packaging/icons/sdrcrow-256.png", "usr/share/icons/hicolor/256x256/apps/sdrcrow.png", "644"],
    ["packaging/icons/sdrcrow-512.png", "usr/share/icons/hicolor/512x512/apps/sdrcrow.png", "644"],
    ["README.md", "usr/share/doc/sdrcrow/README.md", "644"],
    # The speech voice, for the spoken-announcement feature. A separate data
    # file rather than something linked into the binary: it is CC BY-NC-SA,
    # which is not a licence a GPL program may absorb, and keeping it an
    # aggregated asset that the program merely reads is what keeps the two
    # apart. Its notice ships alongside, like the RX-888 firmware's below.
    ["assets/voices/en_US-hfc_female-medium.onnx", "usr/share/sdrcrow/voices/", "644"],
    ["assets/voices/en_US-hfc_female-medium.onnx.json", "usr/share/sdrcrow/voices/", "644"],
    ["assets/voices/en_US-hfc_female-medium.MODEL_CARD", "usr/share/sdrcrow/voices/", "644"],
    ["assets/voices/LICENSE-voice.txt", "usr/share/doc/sdrcrow/LICENSE-voice.txt", "644"],
    # CMUdict (BSD-2-Clause) is embedded in the binary for grapheme-to-phoneme.
    ["crates/sdrcrow-speech/assets/LICENSE-cmudict.txt", "usr/share/doc/sdrcrow/LICENSE-cmudict.txt", "644"],
    # The binary embeds the RX-888's FX3 firmware image, which is MIT licensed
    # rather than GPL like the rest: its notice has to ship with the package.
    ["crates/sdrcrow-rx888/firmware/LICENSE.txt", "usr/share/doc/sdrcrow/LICENSE-rx888-firmware.txt", "644"],
    # The DeepCW model, embedded for the CW decoder. AGPL-3.0-only, which is
    # stronger than this package's GPL and carries a network clause, so its
    # notice ships too — and unlike the ones above it constrains the package
    # rather than merely crediting a part of it.
    ["crates/sdrcrow-deepcw/LICENSE", "usr/share/doc/sdrcrow/LICENSE-deepcw.txt", "644"],
]

# SoapySDR .deb: links libSoapySDR, so recommend the driver modules (apt
# installs Recommends by default). Built with `cargo deb --variant soapysdr`.
[package.metadata.deb.variants.soapysdr]
name = "sdrcrow-soapysdr"
recommends = "soapysdr-module-all"
extended-description = """\
PowerSDR/Thetis-style software-defined-radio transceiver client built on \
SoapySDR with an egui GUI. Runs as a native desktop application or as a \
server that streams the same UI to a web browser. Includes FT8/FT4 digital \
modes and an integrated logbook."""
